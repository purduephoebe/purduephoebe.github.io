name: Daily AIO Literature Scan

on:
  schedule:
    - cron: '0 0 * * *'  # 08:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan academic literature
        run: python scripts/scan.py
      - name: Commit updates
        run: |
          git config user.name "aio-research-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/papers.json
          if git diff --cached --quiet; then
            echo "No literature changes"
          else
            git commit -m "Daily AIO literature update"
            git push
          fi
