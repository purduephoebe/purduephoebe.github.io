<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>百年和平｜臺師大</title>
  <meta name="description" content="以 3D 空拍校園地圖探索國立臺灣師範大學的亮點、研究、社會貢獻、永續與未來展望。" />
  <link rel="icon" type="image/png" href="img/ntnu-emblem-red.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=36" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <main id="shell">
      <header class="brand">
        <img class="brand-logo" src="img/ntnu-emblem-red.png" alt="國立臺灣師範大學校徽" width="52" height="52" />
        <div class="brand-mark">HEPING<br />100.</div>
        <div class="brand-text">
          <div class="brand-zh">百年和平</div>
          <div class="brand-sub"><span>NTNU</span> 百年傳承 世紀典範</div>
        </div>
      </header>

      <nav class="toolbar">
        <div class="seg" id="time-seg" role="group" aria-label="時段">
          <button data-time="morning" title="清晨"><svg viewBox="0 0 24 24"><path d="M4 18h16M7 14a5 5 0 0 1 10 0M12 5v3M5.6 8.6l1.4 1.4M18.4 8.6 17 10"/></svg></button>
          <button data-time="day" class="on" title="正午"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button data-time="dusk" title="黃昏"><svg viewBox="0 0 24 24"><path d="M3 17h18M6 21h12M7 13a5 5 0 0 1 10 0M12 4v3"/></svg></button>
          <button data-time="night" title="夜晚"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
        </div>
        <div class="seg" id="mode-seg" role="group" aria-label="檢視">
          <button id="btn-labels" class="on labelled"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/></svg><span>名牌</span></button>
          <button id="btn-tour" class="labelled"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>導覽</span></button>
          <button id="btn-spin" class="labelled"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span>環繞</span></button>
          <button id="btn-explode" class="labelled" title="把所有建築展開成樓層剖面"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="17" width="16" height="4" rx="1"/></svg><span>剖面</span></button>
          <button id="btn-walk" class="labelled" title="變成一位學生，用 WASD 在校園裡走動"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M12 7.5v6.5M8.5 21l3.5-7 3.5 7M7 11l5-2 5 2"/></svg><span>漫遊</span></button>
          <button id="btn-bird" class="labelled"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></svg><span>鳥瞰</span></button>
        </div>
      </nav>

      <div class="topright">
        <button class="chip-btn" id="btn-overview"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>全景</button>
        <button class="chip-btn" id="btn-list"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>清單</button>
        <button class="chip-btn round" id="btn-help" aria-label="說明">?</button>
      </div>

      <div id="stage">
        <canvas id="scene" aria-label="臺師大和平校區 3D 地圖"></canvas>
        <div id="labels" aria-hidden="false"></div>

        <div id="walk-hud" hidden>
          <div class="walk-cross"></div>
          <div class="walk-bar">
            <div class="walk-where" id="walk-where"></div>
            <button class="chip-btn" id="walk-open">亮點</button>
            <button class="chip-btn" id="walk-view">視角</button>
            <button class="chip-btn" id="walk-exit">離開</button>
          </div>
          <div class="walk-help">WASD／方向鍵 移動 · 拖曳 看四周 · Shift 跑步 · V 第一／第三人稱 · E 看這一區的亮點 · Esc 離開</div>
          <div class="walk-pad">
            <button data-key="KeyW" class="up" aria-label="前進">▲</button>
            <button data-key="KeyA" class="left" aria-label="左移">◀</button>
            <button data-key="KeyS" class="down" aria-label="後退">▼</button>
            <button data-key="KeyD" class="right" aria-label="右移">▶</button>
          </div>
        </div>
      </div>

      <aside id="detail" class="card" aria-live="polite" hidden></aside>
    </main>

    <aside id="index">
      <div class="index-grip" id="index-grip"></div>
      <div class="kicker">THE NTNU INDEX</div>
      <h1 class="index-title">百年師大，<br />俯瞰和平校區。</h1>
      <p class="index-meta" id="index-meta"></p>
      <p id="hint">拖曳旋轉 · 滾輪縮放 · 點建築看內容</p>

      <button class="tour-card" id="tour-card">
        <div>
          <div class="tour-q">第一次來？</div>
          <div class="tour-a">跟著師大獅繞校園一圈，約 1 分鐘看完所有主題。</div>
        </div>
        <span class="arrow">›</span>
      </button>

      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
        <input id="search" type="search" placeholder="搜尋亮點、關鍵字…（如 USR、AI、體操）" autocomplete="off" />
      </label>

      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="themes">主題區</button>
        <button class="tab" data-tab="news">師大新聞</button>
        <button class="tab" data-tab="sources">資料來源</button>
      </div>

      <ol id="theme-list"></ol>
      <div id="search-results" hidden></div>
      <div id="news-list" hidden></div>
      <div id="source-list" hidden></div>

      <footer class="index-foot">
        <p class="foot-note">本專案為課堂練習，不代表師大官方立場與資料。<br />致敬 <a href="https://puma.taipei/heart-island" target="_blank" rel="noopener">Puma團隊政策島</a>。</p>
        內容整理自
        <a href="https://www.ntnu.edu.tw/" target="_blank" rel="noopener">臺師大官網</a>
        及其官方子網站，各條目附原始連結。
      </footer>
    </aside>
  </div>

  <div id="intro" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="kicker" id="intro-kicker">HELLO, NTNU / 01</div>
      <h2 id="intro-title"></h2>
      <p id="intro-body"></p>
      <div class="modal-actions">
        <button class="btn ghost" id="intro-skip">略過</button>
        <button class="btn dark" id="intro-next">下一步 →</button>
      </div>
    </div>
  </div>

  <div id="loading"><div class="loader-lion">🦁</div><div>校園載入中…</div></div>

  <script type="module" src="js/main.js?v=36"></script>
</body>
</html>
